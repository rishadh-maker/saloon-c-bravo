<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | SALOON C BRAVO</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header>

        <nav class="navbar">

            <div class="logo">
                SALOON C BRAVO
            </div>

        </nav>

    </header>



    <!-- ADMIN LOGIN -->

    <main>

        <section class="booking-page">

            <div class="booking-container">

                <h2>
                    Admin Login
                </h2>


                <form id="adminLoginForm">


                    <div class="form-group">

                        <label for="adminUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="adminUsername"
                            placeholder="Enter admin username"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="adminPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter admin password"
                            required
                        >

                    </div>



                    <button
                        type="submit"
                        class="btn"
                    >
                        Login
                    </button>


                </form>


                <p
                    id="loginMessage"
                    style="margin-top: 20px; text-align: center;"
                ></p>


            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 SALOON C BRAVO.
            All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
