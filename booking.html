<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Booking | SALOON C BRAVO</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header>

        <nav class="navbar">

            <div class="logo">
                SALOON C BRAVO
            </div>


            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
            >
                ☰
            </button>


            <ul
                class="nav-links"
                id="navLinks"
            >

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="services.html">
                        Services
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="booking.html">
                        Booking
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- MAIN -->

    <main>


        <section class="page-header">

            <h1>
                Book an Appointment
            </h1>

            <p>
                Choose your service and preferred
                appointment time.
            </p>

        </section>



        <section class="booking-page">

            <div class="booking-container">

                <h2>
                    Appointment Form
                </h2>


                <form id="bookingForm">


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="service">
                            Select Service
                        </label>

                        <select
                            id="service"
                            name="service"
                            required
                        >

                            <option value="">
                                -- Select a Service --
                            </option>

                            <option value="Hair Cutting">
                                Hair Cutting
                            </option>

                            <option value="Hair Styling">
                                Hair Styling
                            </option>

                            <option value="Hair Coloring">
                                Hair Coloring
                            </option>

                            <option value="Facial">
                                Facial
                            </option>

                            <option value="Beard Grooming">
                                Beard Grooming
                            </option>

                            <option value="Special Package">
                                Special Package
                            </option>

                        </select>

                    </div>



                    <div class="form-group">

                        <label for="date">
                            Appointment Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="time">
                            Appointment Time
                        </label>

                        <input
                            type="time"
                            id="time"
                            name="time"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="message">
                            Additional Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Any special request?"
                        ></textarea>

                    </div>



                    <button
                        type="submit"
                        class="btn"
                    >
                        Submit Booking
                    </button>


                </form>

            </div>

        </section>


    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 SALOON C BRAVO.
            All Rights Reserved.
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
